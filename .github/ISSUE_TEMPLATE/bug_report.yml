name: Bug report
description: Something is broken or looks wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't paste transcripts, prompts or screenshots of your whole desktop - the commands below print names and numbers only.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. python minis.py start
        2. ...
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows 11
        - Windows 10 (untested)
        - macOS (experimental port)
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - git clone + python minis.py
        - Windows zip (TaskbarFighters.exe)
        - pip install taskbar-fighters
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0, or the output of `git rev-parse --short HEAD`
  - type: input
    id: display
    attributes:
      label: Display setup
      placeholder: e.g. 2560x1440 at 100%, taskbar at the bottom, 2 monitors
  - type: textarea
    id: status
    attributes:
      label: Output of `python minis.py status` and `python minis.py detect`
      description: Both print program names and numbers only.
      render: text
  - type: textarea
    id: media
    attributes:
      label: GIF or screenshot of the taskbar strip (optional)
      description: Crop to the taskbar, please.
