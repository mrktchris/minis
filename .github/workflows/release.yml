name: Release

# Push a tag like v1.0.0 (after CI is green on master) and this builds every download and drafts nothing by hand:
#   TaskbarFighters-windows.zip   one-click Windows bundle (PyInstaller onedir: TaskbarFighters.exe + assets)
#   TaskbarFighters-macos.zip     experimental macOS bundle (the tagged source; run scripts/setup_mac.sh)
#   taskbar-fighters-<ver>-source.zip
#   taskbar_fighters-<ver>-py3-none-any.whl + .tar.gz   (pip install)
# The release body is docs/release-notes/<tag>.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.0.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  PYTHONUTF8: "1"

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}   # mac port is experimental; see ci.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "$RUNNER_OS" = "macOS" ] && [ -f requirements-mac.txt ]; then pip install -r requirements-mac.txt; fi
      - name: Run tests
        shell: bash
        run: python -m unittest discover -s tests

  windows-bundle:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build with PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean packaging/taskbar_fighters.spec
      - name: Smoke test the exe (read-only commands only)
        shell: bash
        run: |
          ./dist/TaskbarFighters/TaskbarFighters-cli.exe --help
          ./dist/TaskbarFighters/TaskbarFighters-cli.exe detect
          ./dist/TaskbarFighters/TaskbarFighters-cli.exe doctor --headless
          ./dist/TaskbarFighters/TaskbarFighters-cli.exe fighters | grep -q "barbarian, claude, codex"
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item LICENSE, README.md dist/TaskbarFighters/
          Compress-Archive -Path dist/TaskbarFighters -DestinationPath TaskbarFighters-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: TaskbarFighters-windows.zip

  python-dist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wheel + sdist
        run: |
          if [ ! -f pyproject.toml ]; then echo "no pyproject.toml - skipping"; mkdir -p dist; exit 0; fi
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the version matches the tag
        run: |
          v="${TAG#v}"
          ls dist/ | grep -q -- "-${v}" || { echo "::error::dist/ has no ${v} build - bump version in pyproject.toml"; ls dist; exit 1; }
      - name: Source zip
        run: git archive --format=zip --prefix="taskbar-fighters-${TAG#v}/" -o "taskbar-fighters-${TAG#v}-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: |
            dist/*
            taskbar-fighters-*-source.zip

  macos-bundle:
    needs: test
    runs-on: macos-latest
    continue-on-error: true      # experimental
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Zip the source for macOS (py2app bundle is a later step; see docs/PACKAGING.md)
        run: |
          mkdir -p out/TaskbarFighters-macos
          git archive HEAD | tar -x -C out/TaskbarFighters-macos
          if [ -f scripts/setup_mac.sh ]; then chmod +x out/TaskbarFighters-macos/scripts/setup_mac.sh; fi
          cd out && zip -qr ../TaskbarFighters-macos.zip TaskbarFighters-macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: TaskbarFighters-macos.zip

  release:
    needs: [windows-bundle, python-dist, macos-bundle]
    if: ${{ !cancelled() && needs.windows-bundle.result == 'success' && needs.python-dist.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: find artifacts -type f -exec ls -la {} \;
      - name: Release notes
        run: |
          f="docs/release-notes/${TAG}.md"
          if [ ! -f "$f" ]; then echo "::error::$f is missing"; exit 1; fi
          echo "NOTES=$f" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Taskbar Fighters ${{ env.TAG }}
          body_path: ${{ env.NOTES }}
          draft: false
          prerelease: ${{ contains(env.TAG, '-') }}
          fail_on_unmatched_files: false
          files: |
            artifacts/windows/*.zip
            artifacts/macos/*.zip
            artifacts/python/dist/*
            artifacts/python/*.zip

  # ---------------------------------------------------------------- PyPI (trusted publishing; owner set up the
  # pending publisher on pypi.org: project taskbar-fighters, repo mrktchris/taskbar-fighters, workflow release.yml,
  # environment pypi).  Runs only on a v* tag, after the GitHub Release job.
  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python
          path: artifacts
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: artifacts/dist/
